[package]
name = "super-order-web"
version = "1.0.0"
edition = "2021"

[lib]
name = "super_order_web"
path = "src/lib.rs"

[[bin]]
name = "super-order-web"
path = "src/main.rs"

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-multipart = "0.7"
actix-files = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
dotenv = "0.15"
env_logger = "0.11"
log = "0.4"
reqwest = { version = "0.12", features = ["json"] }
hmac = "0.12"
sha1 = "0.10"
hex = "0.4"
urlencoding = "2.1"

[profile.release]
opt-level = 3
codegen-units = 256
lto = "thin"
